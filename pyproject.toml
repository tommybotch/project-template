[project]
name = "project-template"
version = "0.1.0"
description = "[Brief project description]"
requires-python = ">=3.11"

dependencies = [
    # Core scientific stack
    "numpy",
    "scipy",
    "pandas",
    # Add domain-specific packages below (e.g. nibabel, torch, scikit-learn, statsmodels)
    # Visualization
    "matplotlib",
    "seaborn",
    # Notebooks
    "jupyter",
    "ipykernel",
]

[tool.uv]
dev-dependencies = [
    "pytest",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
